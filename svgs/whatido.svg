<svg width="420" height="220" viewBox="0 0 420 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f28ab2">
        <animate attributeName="stop-color"
                 values="#f28ab2; #34353a; #2f3033; #f28ab2"
                 dur="10s"
                 repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#2f3033">
        <animate attributeName="stop-color"
                 values="#2f3033; #f28ab2; #34353a; #2f3033"
                 dur="10s"
                 repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f28ab2"/>
      <stop offset="100%" stop-color="#ffc1d8"/>
    </linearGradient>
  </defs>

  <!-- Border -->
  <rect x="1.5" y="1.5" width="417" height="207" rx="20"
        fill="none"
        stroke="url(#borderGradient)"
        stroke-width="2"/>

  <!-- Background -->
  <rect x="4" y="4" width="412" height="202" rx="18" fill="#111111" />

  <!-- Title row -->
  <g transform="translate(24,22)">
    <!-- AI / architecture icon -->
    <rect x="2" y="2" width="14" height="14" rx="4"
          fill="#111111" stroke="#f28ab2" stroke-width="1" />
    <circle cx="9" cy="9" r="2.4" fill="#34353a" stroke="#ffc1d8" stroke-width="0.8"/>
    <line x1="9" y1="0.5" x2="9" y2="2" stroke="#f28ab2" stroke-width="0.9" stroke-linecap="round"/>
    <line x1="9" y1="16" x2="9" y2="17.5" stroke="#f28ab2" stroke-width="0.9" stroke-linecap="round"/>
    <line x1="0.5" y1="9" x2="2" y2="9" stroke="#f28ab2" stroke-width="0.9" stroke-linecap="round"/>
    <line x1="16" y1="9" x2="17.5" y2="9" stroke="#f28ab2" stroke-width="0.9" stroke-linecap="round"/>
    <circle cx="9" cy="0.5" r="1" fill="#f28ab2"/>
    <circle cx="9" cy="17.5" r="1" fill="#f28ab2"/>
    <circle cx="0.5" cy="9" r="1" fill="#f28ab2"/>
    <circle cx="17.5" cy="9" r="1" fill="#f28ab2"/>

    <!-- Title -->
    <text x="30" y="16"
          fill="url(#titleGradient)"
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif"
          font-size="20"
          font-weight="600">
      What I Do
    </text>
  </g>

  <!-- Subtitle -->
  <text x="24" y="60"
        fill="#bfc0c3"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif"
        font-size="10.5"
        font-style="italic">
    Building backend systems, AI architectures, and tools that turn ideas into products.
  </text>

  <!-- Divider -->
  <line x1="24" y1="78" x2="396" y2="78" stroke="#2f3033" stroke-width="1"/>

  <!-- Bullets -->
  <text x="24" y="104"
        fill="#bfc0c3"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif"
        font-size="12">
    • Design reliable backend systems, APIs, and databases
  </text>

  <text x="24" y="126"
        fill="#bfc0c3"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif"
        font-size="12">
    • Train, fine-tune, and evaluate AI models for real use cases
  </text>

  <text x="24" y="148"
        fill="#bfc0c3"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif"
        font-size="12">
    • Design AI architectures, workflows, and automation pipelines
  </text>

  <text x="24" y="170"
        fill="#bfc0c3"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif"
        font-size="12">
    • Build internal tools that improve speed, quality, and scale
  </text>
</svg>