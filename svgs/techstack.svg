    <circle cx="9" cy="9" r="4" fill="#34353a" stroke="#ffc1d8" stroke-width="0.8"/>
    <circle cx="9" cy="9" r="1.5" fill="#f28ab2"/>
    <line x1="9" y1="3" x2="9" y2="0.5" stroke="#f28ab2" stroke-width="0.8"/>
    <line x1="15" y1="9" x2="17.5" y2="9" stroke="#f28ab2" stroke-width="0.8"/>
    <line x1="9" y1="15" x2="9" y2="17.5" stroke="#f28ab2" stroke-width="0.8"/>
    <line x1="3" y1="9" x2="0.5" y2="9" stroke="#f28ab2" stroke-width="0.8"/>
  </g>

  <text x="474" y="120"
        fill="#f28ab2"
        font-size="16"
        font-weight="600"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif">
    Infra &amp; DevOps
  </text>
  <text x="474" y="142" fill="#bfc0c3" font-size="14"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif">
