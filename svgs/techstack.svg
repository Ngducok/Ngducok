    <circle cx="5" cy="5" r="1.6" fill="#ffc1d8"/>
    <circle cx="13" cy="5" r="1.6" fill="#ffc1d8"/>
    <circle cx="9" cy="12" r="1.6" fill="#f28ab2"/>
    <line x1="5" y1="5" x2="9" y2="12" stroke="#f28ab2" stroke-width="0.8"/>
    <line x1="13" y1="5" x2="9" y2="12" stroke="#f28ab2" stroke-width="0.8"/>
  </g>

  <text x="474" y="222"
