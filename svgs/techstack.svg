<svg width="840" height="488" viewBox="0 0 840 488" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cardTitle cardDesc">
  <title id="cardTitle">Ngducok - Tech Stack</title>
  <desc id="cardDesc">Programming, AI and computer vision, model deployment, embedded systems, robotics and development tools.</desc>
  <defs>
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f28ab2">
        <animate attributeName="stop-color" values="#f28ab2;#34353a;#2f3033;#f28ab2" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#2f3033">
        <animate attributeName="stop-color" values="#2f3033;#f28ab2;#34353a;#2f3033" dur="10s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f28ab2" />
      <stop offset="55%" stop-color="#ffc1d8" />
      <stop offset="100%" stop-color="#f7f7f7" />
    </linearGradient>
  </defs>

  <!-- Card -->
  <rect x="1.5" y="1.5" width="837" height="483" rx="24" fill="none" stroke="url(#borderGradient)" stroke-width="2" />
  <rect x="4" y="4" width="832" height="480" rx="22" fill="#111111" />

  <!-- Heading -->
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif">
    <text x="40" y="60" fill="url(#titleGradient)" font-size="32" font-weight="600">Tech Stack</text>
    <text x="40" y="82" fill="#bfc0c3" font-size="13" font-style="italic">Building AI applications, from model development to real-world edge deployment.</text>
  </g>
  <line x1="420" y1="102" x2="420" y2="351" stroke="#2f3033" stroke-width="1" />

  <!-- LEFT: Programming -->
  <g transform="translate(40,106)" stroke="#f28ab2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect width="18" height="18" rx="4" stroke-width="1" />
    <path d="M7 4 L4 9 L7 14 M11 4 L14 9 L11 14" stroke="#ffc1d8" stroke-width="1.3" />
  </g>
  <text x="70" y="120" class="section">Programming</text>
  <text x="70" y="144" class="detail">Python · C · C++ · Lua</text>

  <!-- LEFT: AI & Computer Vision -->
  <g transform="translate(40,195)" fill="none" stroke="#f28ab2" stroke-width="1.1">
    <rect width="18" height="18" rx="4" />
    <circle cx="5" cy="6" r="2" fill="#ffc1d8" stroke="none" />
    <circle cx="13" cy="6" r="2" fill="#ffc1d8" stroke="none" />
