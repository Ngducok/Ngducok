        font-size="16"
        font-weight="600"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif">
    ML / Vision
  </text>
  <text x="474" y="244"
        fill="#bfc0c3"
        font-size="14"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif">
