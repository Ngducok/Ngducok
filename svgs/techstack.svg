  <g transform="translate(40,287)" fill="none" stroke="#f28ab2" stroke-width="1">
    <rect width="18" height="18" rx="4" />
    <rect x="4.5" y="4.5" width="9" height="9" rx="1.5" stroke="#ffc1d8" />
    <path d="M2 6 H4.5 M2 12 H4.5 M13.5 6 H16 M13.5 12 H16 M6 2 V4.5 M12 2 V4.5 M6 13.5 V16 M12 13.5 V16" />
  </g>
