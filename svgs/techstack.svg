<svg width="840" height="380" viewBox="0 0 840 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f28ab2">
        <animate attributeName="stop-color"
                 values="#f28ab2; #34353a; #2f3033; #f28ab2"
                 dur="10s"
                 repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#2f3033">
        <animate attributeName="stop-color"
                 values="#2f3033; #f28ab2; #34353a; #2f3033"
                 dur="10s"
                 repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f28ab2"/>
      <stop offset="55%" stop-color="#ffc1d8"/>
      <stop offset="100%" stop-color="#f7f7f7"/>
    </linearGradient>
  </defs>

  <!-- Border -->
  <rect x="1.5" y="1.5" width="837" height="373" rx="24"
        fill="none"
        stroke="url(#borderGradient)"
        stroke-width="2"/>

  <!-- Background -->
  <rect x="4" y="4" width="832" height="370" rx="22" fill="#111111" />

  <!-- Title -->
  <text x="40" y="60"
        fill="url(#titleGradient)"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif"
        font-size="32"
        font-weight="600">
    Tech Stack
  </text>

  <text x="40" y="82"
        fill="#bfc0c3"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif"
        font-size="13"
        font-style="italic">
    Tools I use to build backend systems, AI models, automation flows, and production-ready products.
  </text>

  <!-- Column separator -->
  <line x1="420" y1="100" x2="420" y2="350" stroke="#2f3033" stroke-width="1" />

  <!-- Languages icon -->
  <g transform="translate(40,106)">
    <rect x="0" y="0" width="18" height="18" rx="4" fill="#111111" stroke="#f28ab2" stroke-width="1"/>
    <path d="M7 4 L4 9 L7 14" stroke="#ffc1d8" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M11 4 L14 9 L11 14" stroke="#ffc1d8" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="70" y="120"
        fill="#f28ab2"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif"
        font-size="16"
