  <g transform="translate(40,181)">
    <rect x="0" y="0" width="18" height="18" rx="3" fill="#111111" stroke="#f28ab2" stroke-width="1"/>
    <rect x="3" y="3" width="12" height="4" rx="1" fill="#34353a" stroke="#f28ab2" stroke-width="0.8"/>
    <rect x="3" y="8" width="12" height="4" rx="1" fill="#34353a" stroke="#f28ab2" stroke-width="0.8"/>
