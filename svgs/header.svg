<svg width="800" height="110" viewBox="0 0 800 110" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Kuromi-style gradient -->
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f28ab2" />
      <stop offset="55%" stop-color="#ffc1d8" />
      <stop offset="100%" stop-color="#f7f7f7" />
    </linearGradient>

    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34353a" />
      <stop offset="100%" stop-color="#2f3033" />
    </linearGradient>
  </defs>

  <!-- Background transparent for GitHub -->
  <rect width="800" height="110" fill="transparent" />

  <!-- Left swirl -->
  <path
    d="
      M 160 55
      C 150 45, 130 35, 115 35
      C 95 36, 82 48, 75 55
      C 68 62, 55 68, 40 67
      "
    fill="none"
    stroke="url(#grad)"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round" />

  <!-- Small decorative dots left -->
  <circle cx="65" cy="60" r="3" fill="#f28ab2" />
  <circle cx="90" cy="48" r="2" fill="#ffc1d8" />
  <circle cx="108" cy="40" r="1.8" fill="#f7f7f7" />

  <!-- Right swirl mirror -->
  <g transform="scale(-1,1) translate(-800,0)">
    <path
      d="
        M 160 55
        C 150 45, 130 35, 115 35
        C 95 36, 82 48, 75 55
        C 68 62, 55 68, 40 67
        "
      fill="none"
      stroke="url(#grad)"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round" />

    <circle cx="65" cy="60" r="3" fill="#f28ab2" />
    <circle cx="90" cy="48" r="2" fill="#ffc1d8" />
    <circle cx="108" cy="40" r="1.8" fill="#f7f7f7" />
  </g>

  <!-- Central text -->
  <text x="400" y="64"
        text-anchor="middle"
        fill="url(#grad)"
        font-family="'SF Pro Display', 'Inter', 'Segoe UI', system-ui, sans-serif"
        font-size="34"
        font-weight="700"
        letter-spacing="0.8">
    Hello World, i'm Dustii
  </text>

  <!-- Soft underline -->
  <path d="M 250 76 C 310 88, 490 88, 550 76"
        fill="none"
        stroke="#34353a"
        stroke-width="1.4"
        stroke-linecap="round" />

  <path d="M 300 80 C 350 87, 450 87, 500 80"
        fill="none"
        stroke="#f28ab2"
        stroke-width="1.2"
        stroke-linecap="round" />
</svg>